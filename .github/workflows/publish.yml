name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Mints the OIDC token npm exchanges for short-lived publish credentials.
  # This is what removes the need for a long-lived NPM_TOKEN in the repository.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node 22, not 20: npm 12 requires ^22.22.2 and this job needs a modern
      # npm for OIDC. Only the publish tooling runs here — packages are built
      # by bun and still declare `engines: node >= 20` for consumers.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The npm bundled with Node predates OIDC trusted publishing. Pinned to a
      # major so a future npm release cannot silently outrun the Node version
      # above — that is exactly how this step broke the first time.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@12
          echo "npm $(npm --version) on node $(node --version)"

      # The changesets bot commits the version bump. Unsigned commits cannot
      # satisfy the signed-commits rule on main, which previously forced an
      # administrative bypass on every release (#121).
      #
      # Identity is configured unconditionally because `setupGitUser: false`
      # below stops the action from providing one. Signing is layered on top
      # only when the key is available, so a repository without the secret
      # still releases — unsigned, as before, rather than not at all.
      - name: Configure git identity and commit signing
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_EMAIL: ${{ secrets.RELEASE_SIGNING_EMAIL }}
        run: |
          git config --global user.name "elsium-ai-release"
          git config --global user.email "${RELEASE_SIGNING_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::RELEASE_SIGNING_KEY is not set — the release commit will be unsigned and merging it will need an admin bypass (see issue #121)"
            exit 0
          fi

          # The signing key and the commit author must belong to the same
          # GitHub account. Mismatch verifies as `no_user` (unknown address) or
          # `unknown_key` (address belongs to someone else) — signed either way,
          # and still not "Verified", which the ruleset treats as unsigned.
          if [ -z "$RELEASE_SIGNING_EMAIL" ]; then
            echo "::error::RELEASE_SIGNING_EMAIL is required when signing. It must be an address verified on the account that owns the signing key, or the signature buys nothing."
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/release_signing_key"
          install -m 600 /dev/null "$KEY_PATH"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$KEY_PATH"

          git config --global gpg.format ssh
          git config --global user.signingkey "$KEY_PATH"
          git config --global commit.gpgsign true
          echo "Commit signing configured"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
          # Keep the git identity configured above. Left at its default, the
          # action overwrites it with `github-actions[bot]`, and the commit then
          # verifies as `unknown_key`: signed with our key, but authored by an
          # account that key does not belong to. Signed and still not "Verified"
          # is the same outcome as unsigned as far as the ruleset is concerned.
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN / NODE_AUTH_TOKEN: npm authenticates via OIDC using the
          # id-token permission above. Each package must have this repository and
          # workflow registered as a trusted publisher on npmjs.com.
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true' || steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./packages/elsium-ai/package.json').version")
          TAG="elsium-ai@${VERSION}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists, skipping release creation"
            exit 0
          fi

          git tag "${TAG}"
          git push origin "${TAG}"

          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
